<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocofolia_Log_V4</title>
<style>
  :root{
    --paper:#fafaf9; --ink:#1c1c1a; --ink-2:#55534e; --ink-3:#8a877f;
    --line:#e3e1db; --card:#ffffff; --accent:#3d3a34; --badge-bg:#f0efeb;
    --ok:#4a5d4a; --warn:#8a5a3a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
      'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background:var(--paper); color:var(--ink);
    font-size:14px; line-height:1.6; padding:40px 20px 80px;
  }
  .wrap{max-width:860px; margin:0 auto;}
  header{margin-bottom:28px; border-bottom:1px solid var(--ink); padding-bottom:18px;}
  header h1{font-size:19px; font-weight:700; letter-spacing:-0.01em;}
  header p{color:var(--ink-3); font-size:12.5px; margin-top:4px;}
  header .stage{font-family:ui-monospace,'Cascadia Code',Consolas,monospace; font-size:11px;
    color:var(--ink-3); letter-spacing:0.08em; text-transform:uppercase; display:block; margin-bottom:6px;}

  .drop{
    border:1.5px dashed var(--line); border-radius:6px; background:var(--card);
    padding:34px 20px; text-align:center; cursor:pointer; transition:border-color .15s ease;
  }
  .drop:hover, .drop.over{border-color:var(--ink-2);}
  .drop strong{font-weight:600;}
  .drop small{display:block; color:var(--ink-3); margin-top:5px;}
  .drop.loaded{border-style:solid; border-color:var(--line);}
  .drop .fname{font-family:ui-monospace,Consolas,monospace; font-size:12.5px; color:var(--ink-2);}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:20px; margin-top:14px;}
  .panel h2{font-size:12px; font-weight:600; letter-spacing:0.06em; color:var(--ink-3);
    text-transform:uppercase; margin-bottom:14px;}
  .cfg{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  .cfg label{display:block; font-size:11.5px; color:var(--ink-2); margin-bottom:4px;}
  .cfg select{
    width:100%; padding:7px 8px; border:1px solid var(--line); border-radius:4px;
    background:var(--paper); font:inherit; font-size:13px; color:var(--ink);
  }
  .cfg .chk{grid-column:1 / -1; display:flex; align-items:flex-start; gap:8px; margin-top:2px;}
  .cfg .chk input{margin-top:3px;}
  .cfg .charwrap{grid-column:1 / -1;}
  .cfg .charwrap > label small{color:var(--ink-3); font-weight:400; margin-left:6px;}
  .charrow{display:flex; align-items:center; gap:10px; padding:7px 10px;
    border:1px solid var(--line); border-radius:4px; background:var(--paper); margin-top:6px;}
  .charrow .cname{flex:1; font-size:13px; color:var(--ink);}
  .charrow .cname small{color:var(--ink-3); margin-left:4px;}
  .charrow select{width:110px; padding:5px 6px; border:1px solid var(--line);
    border-radius:4px; background:var(--card); font:inherit; font-size:12.5px; color:var(--ink);}
  .cfg .chk span{font-size:12.5px; color:var(--ink-2);}
  .cfg .chk small{display:block; color:var(--ink-3); font-size:11.5px;}

  .actions{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;}
  button{
    font:inherit; font-size:13px; font-weight:600; padding:9px 18px;
    border-radius:4px; border:1px solid var(--accent); cursor:pointer;
    background:var(--accent); color:#fff; transition:opacity .12s ease;
  }
  button:hover{opacity:.85;}
  button.ghost{background:transparent; color:var(--accent);}
  button:disabled{opacity:.35; cursor:default;}

  .stats{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12.5px; color:var(--ink-2);}
  .stats b{color:var(--ink); font-weight:600;}
  .warns{margin-top:10px; font-size:12.5px; color:var(--warn);}
  .warns div{margin-top:3px;}
  .okmsg{color:var(--ok); font-size:12.5px; margin-top:10px;}

  .preview{max-height:460px; overflow-y:auto; border:1px solid var(--line);
    border-radius:4px; background:var(--paper); margin-top:12px;}
  .pline{display:flex; gap:10px; padding:6px 12px; border-bottom:1px solid var(--line);
    font-size:12.5px; align-items:flex-start;}
  .pline:last-child{border-bottom:none;}
  .badge{
    flex:0 0 74px; font-family:ui-monospace,Consolas,monospace; font-size:10.5px;
    background:var(--badge-bg); color:var(--ink-2); border-radius:3px;
    padding:2px 5px; text-align:center; margin-top:1px; white-space:nowrap;
  }
  .pline .txt{white-space:pre-wrap; word-break:break-all; color:var(--ink);
    flex:1; padding:2px 6px; border-radius:2px;}
  /* hwp 스타일 근사 미리보기 (_2_Cocofolia_Log_V4.hwp 실측 색) */
  .st-d2{background:#f0f0f0;}
  .st-d3{background:#d9d9d9;}
  .st-system{background:#d3d3d3;}
  .st-gmdice{background:#d3d3d3; border-top:2px solid #555; border-bottom:2px solid #555; border-radius:0;}
  .st-storydice{border-top:1px solid #555; border-bottom:1px solid #555; border-radius:0;}
  .st-dice{border:1px solid #888;}
  /* 한/글 스타일 근사 미리보기 (_2_Cocofolia_Log_V4.hwp에서 추출) */
  .sv{font-family:'함초롬바탕','HCR Batang','바탕',Batang,'Noto Serif KR',serif;
    color:#111; padding:1px 6px; flex:1;}
  .sv-대사2, .sv-대사2_2{background:#f0f0f0;}
  .sv-대사3, .sv-대사3_2{background:#d9d9d9;}
  .sv-system{background:#d3d3d3;}
  .sv-Storydice{border-top:2px solid #999; border-bottom:2px solid #999;}
  .sv-GMdice{background:#d3d3d3; border-top:3px double #888; border-bottom:3px double #888;}
  .sv-dice{border:1px solid #999;}
  .legend{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .legend .sv{flex:0 0 auto; font-size:12px; padding:2px 10px;}
  .pline .txt .ctl{color:var(--ink-3); font-size:10.5px; font-family:ui-monospace,Consolas,monospace;
    background:var(--badge-bg); border-radius:2px; padding:0 3px; margin:0 2px;}
  .hidden{display:none;}
  footer{margin-top:26px; font-size:11.5px; color:var(--ink-3); line-height:1.7;}
  footer code{font-family:ui-monospace,Consolas,monospace; background:var(--badge-bg);
    padding:1px 4px; border-radius:3px; font-size:11px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Cocofolia_Log_V4</h1>
 </header>

  <div class="drop" id="drop">
    <strong>로그 HTML 파일을 끌어다 놓거나 클릭해서 선택</strong>
    <small>제목[all/main].html</small>
    <input type="file" id="file" accept=".html,.htm,text/html" class="hidden">
  </div>

  <div class="panel hidden" id="cfgPanel">
    <h2>설정</h2>
    <div class="cfg">
      <div>
        <label for="gmSel">GM (Story · 판정)</label>
        <select id="gmSel"></select>
      </div>
      <div class="charwrap">
        <label>캐릭터 스타일 지정 <small>발화 수 상위 5명 · GM 제외 · 목록에 없는 화자는 '대사'로 처리합니다.</small></label>
        <div id="charRows"></div>
      </div>
      <div class="chk">
        <input type="checkbox" id="includeOther">
        <span>잡담 탭 포함
          <small>기본(해제): [other]·[잡담] 문단을 삭제합니다. 체크하면 잡담 발화도 메인과 똑같이 대사·주사위 규칙으로 변환해 출력합니다.</small>
        </span>
      </div>
    </div>
    <div class="actions">
      <button id="runBtn">변환</button>
    </div>
  </div>

  <div class="panel hidden" id="outPanel">
    <h2>결과</h2>
    <div class="stats" id="stats"></div>
    <div class="warns" id="warns"></div>
    <div class="okmsg" id="okmsg"></div>
    <div class="legend">
      <span class="sv sv-Story">Story</span>
      <span class="sv sv-Storydice">Storydice</span>
      <span class="sv sv-system">system</span>
      <span class="sv sv-dice">dice</span>
      <span class="sv sv-GMdice">GMdice</span>
      <span class="sv sv-대사">대사</span>
      <span class="sv sv-대사1_2">대사1_2</span>
      <span class="sv sv-대사2">대사2</span>
      <span class="sv sv-대사2_2">대사2_2</span>
      <span class="sv sv-대사3">대사3</span>
      <span class="sv sv-대사3_2">대사3_2</span>
    </div>
    <div class="preview" id="preview"></div>
    <div class="actions">
      <button id="dlBtn">TXT 다운로드</button>
      <button id="cpBtn" class="ghost">클립보드에 복사</button>
    </div>
  </div>

  <footer>
    TXT 다운로드 혹은 클립보드에 복사 후 한글 파일을 열어 맨 아랫줄에 붙여넣습니다.
  </footer>
</div>

<script>
(function(){
  "use strict";
  var MK = "@@";
  var TAG_ALIAS = { "메인":"main", "メイン":"main", "잡담":"other", "정보":"info" };
  var rowsData = null;     // [{tag, name, rawBody}]
  var outLines = null;

  var $ = function(id){ return document.getElementById(id); };

  // ── 파일 입력 ──────────────────────────────────────────────
  var drop = $("drop"), fileIn = $("file");
  drop.addEventListener("click", function(){ fileIn.click(); });
  drop.addEventListener("dragover", function(e){ e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", function(){ drop.classList.remove("over"); });
  drop.addEventListener("drop", function(e){
    e.preventDefault(); drop.classList.remove("over");
    if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
  });
  fileIn.addEventListener("change", function(){
    if (fileIn.files.length) loadFile(fileIn.files[0]);
  });

  function loadFile(f){
    var r = new FileReader();
    r.onload = function(){
      parseHtml(String(r.result));
      drop.classList.add("loaded");
      drop.innerHTML = '<strong>불러옴</strong><small class="fname">' + escUi(f.name) + '</small><small>다시 클릭하면 다른 파일을 선택합니다</small>';
      var inp = document.createElement("input");
      inp.type="file"; inp.id="file"; inp.accept=".html,.htm,text/html"; inp.className="hidden";
      inp.addEventListener("change", function(){ if(inp.files.length) loadFile(inp.files[0]); });
      drop.appendChild(inp); fileIn = inp;
    };
    r.readAsText(f, "utf-8");
  }

  function escUi(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

  // ── HTML 파싱 ──────────────────────────────────────────────
  function parseHtml(src){
    var doc = new DOMParser().parseFromString(src, "text/html");
    var ps = doc.querySelectorAll("p");
    var rows = [];
    ps.forEach(function(p){
      var spans = p.querySelectorAll(":scope > span");
      if (spans.length < 3) return;
      var tag = (spans[0].textContent || "").trim();        // "[other]" 등
      tag = tag.replace(/^\[|\]$/g, "");
      // 한국어/일본어 태그 정규화: [메인]·[メイン]→main, [잡담]→other, [정보]→info
      if (TAG_ALIAS[tag]) tag = TAG_ALIAS[tag];
      var name = (spans[1].textContent || "").trim();
      var rawBody = spans[2].innerHTML;                      // <br> 보존
      rows.push({tag: tag, name: name, raw: rawBody});
    });
    rowsData = rows;
    fillConfig(rows);
    $("cfgPanel").classList.remove("hidden");
    $("outPanel").classList.add("hidden");
  }

  function fillConfig(rows){
    var freq = {};   // main 발화 빈도
    var all = {};
    rows.forEach(function(r){
      all[r.name] = true;
      if (r.tag === "main") freq[r.name] = (freq[r.name]||0) + 1;
    });
    var names = Object.keys(all).sort(function(a,b){ return (freq[b]||0)-(freq[a]||0); });
    lastNames = names; lastFreq = freq;
    var gm = $("gmSel"); gm.innerHTML = "";
    names.forEach(function(n){
      var o = document.createElement("option");
      o.value = n; o.textContent = n + (freq[n] ? " ("+freq[n]+")" : "");
      gm.appendChild(o);
    });
    var GM_NAME_ALIASES = ["키퍼","KP","GM","Keeper","게임마스터","마스터","진행자"];
    var guessed = null;
    for (var gi=0; gi<GM_NAME_ALIASES.length; gi++){
      if (names.indexOf(GM_NAME_ALIASES[gi]) >= 0){ guessed = GM_NAME_ALIASES[gi]; break; }
    }
    if (guessed == null) guessed = names[0] || null;
    if (guessed != null) gm.value = guessed;
    gm.onchange = buildCharRows;
    buildCharRows();
  }

  var lastNames = null, lastFreq = null;
  var GROUPS = ["대사", "대사2", "대사3"];

  function buildCharRows(){
    var GM = $("gmSel").value;
    var box = $("charRows"); box.innerHTML = "";
    var cands = lastNames.filter(function(n){ return n !== GM && (lastFreq[n]||0) > 0; }).slice(0, 5);
    cands.forEach(function(n, idx){
      var row = document.createElement("div"); row.className = "charrow";
      var nm = document.createElement("span"); nm.className = "cname";
      nm.textContent = n;
      var ct = document.createElement("small"); ct.textContent = "발화 " + (lastFreq[n]||0);
      nm.appendChild(ct);
      var sel = document.createElement("select");
      sel.setAttribute("data-name", n);
      GROUPS.forEach(function(g){
        var o = document.createElement("option");
        o.value = g; o.textContent = g;
        sel.appendChild(o);
      });
      // 기본값: 발화 1위 → 대사2, 2위 → 대사3, 나머지 → 대사
      sel.value = idx === 0 ? "대사2" : idx === 1 ? "대사3" : "대사";
      row.appendChild(nm); row.appendChild(sel); box.appendChild(row);
    });
  }

  function charAssignments(){
    var map = {};
    $("charRows").querySelectorAll("select[data-name]").forEach(function(sel){
      map[sel.getAttribute("data-name")] = sel.value;
    });
    return map;
  }

  // ── 텍스트 유틸 ─────────────────────────────────────────────
  var tmp = document.createElement("div");
  function chunkText(htmlChunk){           // 태그 제거 + 엔티티 해제 + 공백 정리
    tmp.innerHTML = htmlChunk;
    return (tmp.textContent || "").replace(/\s+/g," ").trim();
  }
  function flat(rawBody){                  // <br> → 공백 후 전체 평탄화
    return chunkText(rawBody.replace(/<br\s*\/?>/gi, " "));
  }
  function isDice(t){ return /\(\d*[dD]\d+(<=\d+)?\)/.test(t) && t.indexOf("＞") >= 0; }
  function isJudge(t){
    if (isDice(t) || t.length > 30) return false;
    return /^\S.{0,20}판정(\s+\d+\s*\/\s*\S+)?$/.test(t.trim());
  }
  function isSanity(t){ return /^\d+\s*\/\s*\S+$/.test(t.trim()); }
  function diceBreak(t){ return t.replace(/\)\s+(?=보너스)/, ")"+MK+"BR"+MK); }

  // ── 변환 (규칙 1~13) ────────────────────────────────────────
  function convert(){
    var GM  = $("gmSel").value;
    var asg = charAssignments();          // {이름: "대사"|"대사2"|"대사3"}
    var includeOther = $("includeOther").checked;

    var CONT = { "대사":"대사1_2", "대사2":"대사2_2", "대사3":"대사3_2" };
    function firstStyle(n){ return asg[n] || "대사"; }
    function contStyle(n){  return CONT[asg[n] || "대사"]; }

    // 1단계: other/공백/'-' 정리한 시퀀스 구성.
    //  '-' 는 장면 구분자 → 삭제하되 연속·병합을 끊는 표식으로 남김.
    //  잡담 탭 포함 옵션 시 other 발화도 메인과 동일하게 처리.
    var seq = [];
    var nOther = 0, nDash = 0, nEmpty = 0;
    rowsData.forEach(function(r){
      if (r.tag === "other" && !includeOther){ nOther++; return; }
      if (r.tag === "info"){ seq.push({k:"info", name:r.name, raw:r.raw}); return; }
      var b = flat(r.raw);
      if (!b){ nEmpty++; return; }                     // 규칙 2
      if (b === "-"){ nDash++; seq.push({k:"break"}); return; }
      if (r.tag === "other") nOther++;
      seq.push({k:"main", name:r.name, raw:r.raw, b:b});
    });

    var out = [];                                       // [style, text]
    var prevDialog = null;                              // 직전 발화 화자(네임 표기 상태)
    var i = 0, N = seq.length;

    while (i < N){
      var it = seq[i];

      if (it.k === "break"){ prevDialog = null; i++; continue; }

      if (it.k === "info"){                             // 규칙 3·4·5
        var para = it.name + MK+"BR"+MK + flat(it.raw);
        var j = i + 1;
        while (j < N && seq[j].k === "info"){
          para += MK+"BR"+MK + seq[j].name + MK+"BR"+MK + flat(seq[j].raw);
          j++;
        }
        out.push(["system", para]);
        prevDialog = null; i = j; continue;
      }

      var b = it.b;

      if (it.name === GM){
        prevDialog = null;
        if (isJudge(b)){                                // 규칙 6
          if (i+1 < N && seq[i+1].k==="main" && seq[i+1].name===GM && isSanity(seq[i+1].b)){
            b += " " + seq[i+1].b; i++;
          }
          out.push(["Storydice", b]); i++; continue;
        }
        if (isDice(b)){                                 // 규칙 7 (GM 주사위)
          out.push(["GMdice", diceBreak(b)]); i++; continue;
        }
        // 규칙 10: 연속 GM 서술 병합 → Story
        var parts = [b]; var j2 = i + 1;
        while (j2 < N && seq[j2].k === "main" && seq[j2].name === GM){
          var b2 = seq[j2].b;
          if (isJudge(b2) || isDice(b2)) break;
          parts.push(b2); j2++;
        }
        out.push(["Story", parts.join(" ")]); i = j2; continue;
      }

      // 플레이어
      if (isDice(b)){                                   // 규칙 7 (플레이어 주사위)
        if (prevDialog !== it.name)
          out.push([firstStyle(it.name), it.name + "\t"]);
        out.push(["dice", diceBreak(b)]);
        prevDialog = null; i++; continue;
      }

      // 규칙 8·9·11·12: 대사 (본문 <br> 은 이어지는 문단으로 분리)
      var chunks = it.raw.split(/<br\s*\/?>/gi).map(chunkText).filter(function(c){ return c; });
      var cont = (prevDialog === it.name);
      chunks.forEach(function(c){
        if (!cont){ out.push([firstStyle(it.name), it.name + "\t" + c]); cont = true; }
        else      { out.push([contStyle(it.name), c]); }
      });
      prevDialog = it.name; i++; continue;
    }

    outLines = out;
    render(out, {other:nOther, dash:nDash, empty:nEmpty, incl:includeOther});
  }

  // ── 결과 표시 ──────────────────────────────────────────────
  function render(out, del){
    var counts = {};
    out.forEach(function(p){ counts[p[0]] = (counts[p[0]]||0)+1; });
    var order = ["Story","Storydice","system","dice","GMdice","대사2","대사2_2","대사3","대사3_2","대사","대사1_2"];
    var html = "<span>문단 <b>"+out.length+"</b></span>";
    order.forEach(function(k){ if (counts[k]) html += "<span>"+k+" <b>"+counts[k]+"</b></span>"; });
    html += del.incl
      ? "<span>잡담 포함 <b>"+del.other+"</b> · 삭제 — 구분선 <b>"+del.dash+"</b> · 빈 문단 <b>"+del.empty+"</b></span>"
      : "<span>삭제 — 잡담 <b>"+del.other+"</b> · 구분선 <b>"+del.dash+"</b> · 빈 문단 <b>"+del.empty+"</b></span>";
    $("stats").innerHTML = html;

    // 마커 충돌 검사
    var warns = [];
    out.forEach(function(p, idx){
      var body = p[1].split(MK+"BR"+MK).join("");
      if (body.indexOf(MK) >= 0)
        warns.push("문단 " + (idx+1) + ": 본문에 '"+MK+"' 문자가 있어 매크로가 오작동할 수 있습니다.");
    });
    $("warns").innerHTML = warns.map(function(w){ return "<div>⚠ "+escUi(w)+"</div>"; }).join("");
    $("okmsg").textContent = warns.length ? "" : "마커 충돌 없음 — 매크로 적용에 안전합니다.";

    var STYLE_CLS = {
      "대사2":"st-d2","대사2_2":"st-d2",
      "대사3":"st-d3","대사3_2":"st-d3",
      "system":"st-system","GMdice":"st-gmdice",
      "Storydice":"st-storydice","dice":"st-dice"
    };
    var pv = $("preview"); pv.innerHTML = "";
    var frag = document.createDocumentFragment();
    out.forEach(function(p){
      var d = document.createElement("div"); d.className = "pline";
      var bd = document.createElement("span"); bd.className = "badge"; bd.textContent = p[0];
      var tx = document.createElement("span");
      tx.className = "txt" + (STYLE_CLS[p[0]] ? " " + STYLE_CLS[p[0]] : "");
      var parts = p[1].split(MK+"BR"+MK);
      parts.forEach(function(seg, k){
        if (k > 0){ var c=document.createElement("span"); c.className="ctl"; c.textContent="⏎"; tx.appendChild(c); }
        seg.split("\t").forEach(function(s2, k2){
          if (k2 > 0){ var t=document.createElement("span"); t.className="ctl"; t.textContent="⇥"; tx.appendChild(t); }
          tx.appendChild(document.createTextNode(s2));
        });
      });
      d.appendChild(bd); d.appendChild(tx); frag.appendChild(d);
    });
    pv.appendChild(frag);
    $("outPanel").classList.remove("hidden");
  }

  function buildTxt(){
    return outLines.map(function(p){ return MK + p[0] + MK + p[1]; }).join("\r\n");
  }

  $("runBtn").addEventListener("click", function(){ if (rowsData) convert(); });
  $("dlBtn").addEventListener("click", function(){
    if (!outLines) return;
    var blob = new Blob(["\uFEFF" + buildTxt()], {type:"text/plain;charset=utf-8"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "코코포리아_V4_마커.txt";
    a.click(); URL.revokeObjectURL(a.href);
  });
  $("cpBtn").addEventListener("click", function(){
    if (!outLines) return;
    navigator.clipboard.writeText(buildTxt()).then(function(){
      $("cpBtn").textContent = "복사됨 ✓";
      setTimeout(function(){ $("cpBtn").textContent = "클립보드에 복사"; }, 1500);
    });
  });
})();
</script>
</body>
</html>
